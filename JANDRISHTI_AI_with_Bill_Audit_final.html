const BCATS=['Sanitation','Drainage','Water Supply','Public Works','Street Lighting','Events','Other'];
const BREASONS=['Amount mismatch','Blurry scan','Wrong date','Invoice number mismatch','Vendor not registered','Other'];
const BALLOC={day:20000,week:125000,month:500000};

const BLV={low:'Low risk',med:'Medium risk',high:'High risk'};
const AUTO_FLAG_AT=50;

const fdate=s=>new Date(s+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});

const bf0=()=>({vendor:'',inv:'',date:biso(new Date()),amount:'',cat:'Sanitation',file:null});
let B={view:'week',tab:'ledger',wf:'all',open:null,ov:null,aud:false,form:bf0(),err:{},focus:false};

/* ---- AI risk engine ---- */
function bscore(b){
 const others=S.bills.filter(x=>x.id!==b.id),rs=[],add=(p,tx)=>rs.push({p,t:tx});
 const nk=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
 const dups=others.filter(x=>nk(x.inv)===nk(b.inv));
 if(dups.length){const sv=dups.filter(x=>nk(x.vendor)===nk(b.vendor));
  if(sv.length)add(50,`Duplicate invoice no. ${b.inv} – already filed by this vendor (${sv[0].id})`);
  else add(30,`Invoice no. ${b.inv} is also used by ${dups[0].vendor} (${dups[0].id})`)}
 const vs=others.filter(x=>nk(x.vendor)===nk(b.vendor)),pool=vs.length?vs:others.filter(x=>x.cat===b.cat);
 if(pool.length){const avg=pool.reduce((s,x)=>s+x.amount,0)/pool.length,ratio=b.amount/avg;
  const basis=(vs.length?'this vendor':`the ${b.cat} category`)+` (${pool.length} other bill${pool.length>1?'s':''})`;
  const m=`${inr(b.amount)} is ${ratio.toFixed(1)}× the average ${inr(Math.round(avg))} for ${basis}`;
  if(ratio>=3)add(40,m);else if(ratio>=2)add(25,m)}
 const d=new Date(b.date+'T00:00:00'),t0=new Date();t0.setHours(0,0,0,0);const diff=Math.round((t0-d)/864e5);
 if(diff<0)add(40,`Dated ${-diff} day${diff<-1?'s':''} in the future (${fdate(b.date)})`);
 else if(d.getMonth()!==t0.getMonth()||d.getFullYear()!==t0.getFullYear())add(diff>30?25:10,`Dated ${fdate(b.date)} (${diff} days ago) – outside the current billing month`);
 const dow=d.getDay();if(dow===0||dow===6)add(15,`Dated on a ${dow===0?'Sunday':'Saturday'} – offices are normally closed`);
 const hol=BHOL[b.date.slice(5)];if(hol)add(20,`Dated on a public holiday (${hol})`);
 const score=Math.min(100,rs.reduce((s,r)=>s+r.p,0));
 return {score,level:score>=AUTO_FLAG_AT?'high':score>=25?'med':'low',reasons:rs}}
const brk=r=>`<span class="ba-rk ${r.level}">Risk ${r.score}</span>`;
const brcard=r=>`<div class="ba-rcard ${r.level}"><div class="ba-rh"><div><div class="ba-mu">Audit risk score</div><div class="ba-rs">${r.score}<small> / 100</small></div></div><span class="ba-rk ${r.level}">${BLV[r.level]}</span></div><div class="ba-rbar"><i style="width:${r.score}%"></i></div>${r.reasons.length?`<ul class="ba-rr">${r.reasons.map(x=>`<li><b>+${x.p}</b><span>${esc(x.t)}</span></li>`).join('')}</ul>`:'<div class="ba-mu" style="margin-top:10px">No risk signals found.</div>'}</div>`;
/* add a bill, score it, auto-flag when risk is high */
function addBill(b){S.bills.unshift(b);const r=bscore(b);
 if(r.score>=AUTO_FLAG_AT){b.status='flagged';b.audit.push({who:'Audit AI',what:'Auto-flagged – risk score '+r.score,at:stamp()});
  b.comments.push({by:'Audit AI',text:`Auto-flagged (risk ${r.score}): `+r.reasons.map(x=>x.t).join('; ')+'.',at:stamp()})}
 return r}

 const A=(w,v,i,d,a,c,s,cm,au)=>({id:'',ward:w,vendor:v,inv:i,date:dAgo(d),amount:a,cat:c,status:s,fname:'',comments:cm,audit:au});
 const L=[
  A(24,'Shree Clean Services','INV-2041',0,18500,'Sanitation','pending',[],[{who:sbn(24),what:'Submitted bill',at:dAgo(0)+' 09:12'}]),
  A(12,'Rajasthan Roadworks','RW/884',2,64200,'Public Works','flagged',[{by:'Auditor',text:'Scan shows ₹46,200 but the form says ₹64,200. Please check.',at:dAgo(1)+' 16:05'}],[{who:sbn(12),what:'Submitted bill',at:dAgo(2)+' 10:40'},{who:ADM,what:'Flagged – Amount mismatch',at:dAgo(1)+' 16:05'}]),
  A(24,'Jaipur Jal Suppliers','JJ-310',5,22000,'Water Supply','verified',[],[{who:sbn(24),what:'Submitted bill',at:dAgo(5)+' 11:00'},{who:ADM,what:'Verified bill',at:dAgo(5)+' 15:30'}]),
  A(35,'BrightLine Electricals','BL-77',12,48800,'Street Lighting','verified',[],[{who:sbn(35),what:'Submitted bill',at:dAgo(12)+' 10:10'},{who:ADM,what:'Verified bill',at:dAgo(11)+' 12:00'}])];
 L.forEach((b,i)=>b.id='BL-2026-'+String(i+1).padStart(4,'0'));return L}
if(!S.bills){S.bills=seedBills();
 /* demo bills that exercise the audit rules (duplicate invoice / weekend date) */
 const dm=(w,v,i,d,a,c,at)=>({id:'BL-2026-'+String(S.bills.length+1).padStart(4,'0'),ward:w,vendor:v,inv:i,date:d,amount:a,cat:c,status:'pending',fname:'',comments:[],audit:[{who:sbn(w),what:'Submitted bill',at}]});
 addBill(dm(24,'Shree Clean Services','INV-2041',dAgo(1),52000,'Sanitation','Yesterday, 17:48'));
 addBill(dm(35,'Pink City Events','PCE-12',lastSun(),35000,'Events','Mon, 10:05'))}

const bpill=s=>`<span class="ba-pill ${s}">${BST[s]}</span>`;
const bInP=(s,v)=>{const t0=new Date(),d=new Date(s+'T00:00:00');if(v==='day')return s===biso(t0);if(v==='week')return (t0-d)/864e5<7&&d<=t0;return d.getMonth()===t0.getMonth()&&d.getFullYear()===t0.getFullYear()};
const bview=(u,ty)=>!u?`<div class="ba-fb">Preview not available (file was not kept after reload).</div>`:(ty||'').startsWith('image/')?`<img src="${u}" alt="Bill scan" style="width:100%;height:100%;object-fit:contain;background:#fff">`:`<object data="${u}" type="application/pdf"><div class="ba-fb">PDF preview is not supported in this browser.</div></object>`;
function bdoc(b,style){let h;
 if(b.fname)h=bview(BU[b.id],BT[b.id]);
 else h=`<div class="ba-inv"><span class="ba-demo">Demo scan</span><h3>${esc(b.vendor)}</h3><div>Invoice ${esc(b.inv)} · ${fdate(b.date)}</div><table><tr><th>Item</th><th>Amount</th></tr>${[['Service charges',.7],['Materials',.2],['Transport',.1]].map(x=>`<tr><td>${x[0]}</td><td>${inr(Math.round(b.amount*x[1]))}</td></tr>`).join('')}</table><div class="ba-tot">Total ${inr(b.amount)}</div></div>`;
 return `<div class="ba-pdf" style="${style}">${h}</div>`}

function billPage(){const adm=S.role==='admin';
 const wsel2=adm?`<select class="ba-sel" aria-label="Ward filter" onchange="B.wf=this.value;R()"><option value="all">All wards</option>${Object.keys(WARDS).map(k=>`<option value="${k}" ${B.wf==k?'selected':''}>Ward ${k}</option>`).join('')}</select>`
  :`<select class="ba-sel" aria-label="Ward" onchange="setW(this.value)">${Object.keys(WARDS).map(k=>`<option value="${k}" ${+k===S.ward?'selected':''}>Ward ${k}</option>`).join('')}</select>`;
 const sub=adm?(B.wf==='all'?'All wards':WARDS[B.wf].n):WARDS[S.ward].n;
 const nav=adm?'':`<div class="ba-nav">${[['ledger','Ledger'],['submit','Submit bill']].map(x=>`<button class="${B.tab===x[0]?'on':''}" onclick="B.tab='${x[0]}';R()">${x[1]}</button>`).join('')}</div>`;
 return `<div class="ba"><div class="ba-hd"><div><h1>${t('Bill Audit')}</h1><div class="ba-sub">${esc(sub)} · ${adm?'Auditor':'Submitter'}</div></div><div class="ba-hr">${wsel2}<button class="ba-theme" onclick="bTheme()" aria-label="Toggle theme">🌓</button></div></div>
<div class="ba-main">${(adm||B.tab==='ledger')?bLedger(adm):bForm()}</div>${nav}${B.open?bmodal():''}</div>`}
function bLedger(adm){
 const rows=S.bills.filter(b=>(adm?(B.wf==='all'||b.ward==B.wf):b.ward===S.ward)&&bInP(b.date,B.view)).sort((a,b)=>b.date.localeCompare(a.date));
 const sp=rows.filter(b=>b.status==='verified').reduce((s,b)=>s+b.amount,0),op=rows.filter(b=>b.status!=='verified').reduce((s,b)=>s+b.amount,0);
 const al=BALLOC[B.view]*(adm&&B.wf==='all'?Object.keys(WARDS).length:1),pc=Math.min(100,sp/al*100);
 const hi=rows.filter(b=>b.status!=='verified'&&bscore(b).level==='high').length;
 return `<div class="ba-seg">${[['day','Day View'],['week','Week View'],['month','Month View']].map(([k,l])=>`<button class="${B.view===k?'on':''}" onclick="B.view='${k}';R()">${l}</button>`).join('')}</div>
<div class="ba-pad"><div class="ba-hero"><div class="l">Allocated budget</div><div class="v">${inr(al)}</div><div class="ba-bar"><i style="width:${pc}%"></i></div><div class="s">${pc.toFixed(1)}% used by verified bills</div></div>
<div class="ba-mini"><div style="border-color:var(--green)"><span class="ba-mu">Spent (verified)</span><b style="color:var(--green)">${inr(sp)}</b></div><div style="border-color:var(--orange)"><span class="ba-mu">Pending / flagged</span><b style="color:var(--orange)">${inr(op)}</b></div></div>
${hi?`<div class="ba-attn">⚠ ${hi} high-risk bill${hi>1?'s':''} need${hi>1?'':'s'} attention</div>`:''}
<h2 class="ba-h2">Transactions</h2>${rows.map(b=>`<button class="ba-row" onclick="bopen('${b.id}')"><div class="m"><div class="vn">${esc(b.vendor)}</div><div class="ba-mu">${fdate(b.date)} · ${esc(b.cat)}${adm?' · Ward '+b.ward:''}</div></div><div class="rt"><div class="amt">${inr(b.amount)}</div><div class="tags">${brk(bscore(b))}${bpill(b.status)}</div></div></button>`).join('')||`<div class="ba-empty">No bills in this period.${adm?'':'<br>Submit one from the Submit bill tab.'}</div>`}
<div class="ba-note">Fictional demo bills. Uploaded files stay in this browser tab only and are not sent to any server. Only the Administrator (auditor) can verify or flag a bill.</div></div>`}
function bin(k,el){B.form[k]=el.value;if(B.err[k]){delete B.err[k];el.classList.remove('bad');const e=el.parentNode.querySelector('.ba-err');if(e)e.remove()}}
function bForm(){const f=B.form,e=B.err;
 const fld=(k,l,ty,ph,ex)=>`<div class="ba-fld"><label for="bf_${k}">${l}</label><input class="ba-inp${e[k]?' bad':''}" id="bf_${k}" type="${ty}" value="${esc(f[k])}" placeholder="${ph}" ${ex||''} oninput="bin('${k}',this)">${e[k]?`<div class="ba-err">${e[k]}</div>`:''}</div>`;
 return `<div class="ba-pad">${fld('vendor','Vendor name','text','e.g. Shree Clean Services')}${fld('inv','Invoice no.','text','e.g. INV-2041')}
<div class="ba-two"><div>${fld('date','Date','date','')}</div><div>${fld('amount','Amount (₹)','number','0','inputmode="decimal" min="0"')}</div></div>
<label>Category</label><div class="ba-chips">${BCATS.map(c=>`<button type="button" class="ba-chip${f.cat===c?' on':''}" onclick="B.form.cat='${c}';R()">${c}</button>`).join('')}</div>
<label style="margin-top:16px">Bill scan (PDF or photo)</label><label class="ba-drop${e.file?' bad':''}" for="bf_file"><span style="font-size:22px">📎</span><b>${f.file?esc(f.file.name):'Choose PDF or image'}</b>${f.file?`<span class="ba-mu">${(f.file.size/1024).toFixed(0)} KB · tap to replace</span>`:''}</label>
<input id="bf_file" type="file" accept="application/pdf,image/*" hidden onchange="bpick(this.files[0])">
<label class="ba-drop" for="bf_cam" style="margin-top:8px;padding:12px"><b style="margin:0">📷 Scan with camera</b></label><input id="bf_cam" type="file" accept="image/*" capture="environment" hidden onchange="bpick(this.files[0])">
${e.file?`<div class="ba-err">${e.file}</div>`:''}
${f.file?`<label style="margin-top:16px">Preview before submitting</label><div class="ba-pdf" style="height:320px">${bview(BU.draft,f.file.type)}</div>`:''}
<button class="ba-btn ink" style="margin-top:20px" onclick="bsubmit()">Submit bill for review</button></div>`}
function bpick(f){if(!f)return;
 if(!(f.type==='application/pdf'||f.type.startsWith('image/'))){B.err.file='Use a PDF or an image scan.';R();return}
 if(f.size>1e7){B.err.file='File exceeds 10MB.';R();return}
 if(BU.draft)URL.revokeObjectURL(BU.draft);BU.draft=URL.createObjectURL(f);B.form.file=f;delete B.err.file;R()}
function bsubmit(){const f=B.form,e={};
 if(!f.vendor.trim())e.vendor='Enter the vendor name';if(!f.inv.trim())e.inv='Enter the invoice number';
 if(!f.date||isNaN(new Date(f.date)))e.date='Pick the bill date';if(!(Number(f.amount)>0))e.amount='Enter an amount above 0';
 if(!f.file)e.file='Attach the bill scan';B.err=e;if(Object.keys(e).length){R();return}
 const id='BL-2026-'+String(S.bills.length+1).padStart(4,'0');BU[id]=BU.draft;BT[id]=f.file.type;delete BU.draft;
 const r=addBill({id,ward:S.ward,vendor:f.vendor.trim(),inv:f.inv.trim(),date:f.date,amount:Number(f.amount),cat:f.cat,status:'pending',fname:f.file.name,comments:[],audit:[{who:sbn(S.ward),what:'Submitted bill',at:stamp()}]});
 B.form=bf0();B.err={};B.tab='ledger';B.view='month';
 toast(r.score>=AUTO_FLAG_AT?`Bill ${id} auto-flagged by audit (risk ${r.score}). The Administrator will review it.`:`Bill ${id} submitted. The Administrator will review it.`);R()}
function bmodal(){const b=bcur();if(!b){B.open=null;return''}const adm=S.role==='admin';
 const audit=B.aud?b.audit.map(a=>`<div class="ba-ai"><div><b>${esc(a.what)}</b><div class="ba-mu">${esc(a.who)} · ${esc(a.at)}</div></div></div>`).join(''):'';
 const acts=adm?`<button class="ba-btn ba-red" onclick="B.ov='flag';R()" ${b.status==='flagged'?'disabled':''}>Flag for Recheck</button><button class="ba-btn g" onclick="bapprove()" ${b.status==='verified'?'disabled':''}>Approve &amp; Verify</button>`
  :b.status==='flagged'?`<button class="ba-btn ink" onclick="bresub()">Mark as corrected &amp; resubmit</button>`:`<div class="ba-mu" style="flex:1;text-align:center">Only the Administrator can verify or flag bills.</div>`;
 let ov='';
 if(B.ov==='flag')ov=`<div class="ba-scrim" onclick="if(event.target===this){B.ov=null;R()}"><div class="ba-sheet"><h3>Why does this bill need a recheck?</h3>${BREASONS.map(r=>`<button class="ba-reason" onclick="bflag('${r}')">${r}</button>`).join('')}</div></div>`;
 if(B.ov==='chat'){const msgs=b.comments.length?b.comments.map(c=>{const me=c.by==='Audit AI'?false:(c.by==='Auditor')===adm;return `<div class="ba-bub ${me?'me':'ot'}"><small>${esc(c.by)} · ${esc(c.at)}</small>${esc(c.text)}</div>`}).join(''):'<div class="ba-empty">No messages yet. Ask or clarify anything about this bill.</div>';
  ov=`<div class="ba-scrim" onclick="if(event.target===this){B.ov=null;R()}"><div class="ba-sheet"><h3>Discussion · ${b.id}</h3><div class="ba-chat"><div class="ba-msgs" id="bmsgs">${msgs}</div><div class="ba-send"><input class="ba-inp" id="bci" placeholder="Write a message" autocomplete="off" onkeydown="if(event.key==='Enter')bsend()"><button class="ba-btn ink" onclick="bsend()">Send</button></div></div></div></div>`}
 return `<div class="ba-wrap" role="dialog" aria-modal="true" aria-label="Bill review"><div class="ba-modal"><div class="ba-mh"><button class="back" onclick="bclose()">‹ Back</button><span class="id">${b.id}</span>${bpill(b.status)}</div>
<div style="padding:12px 12px 0">${bdoc(b,'height:240px')}</div>
<div style="flex:1;overflow-y:auto;padding:16px"><div class="ba-big">${inr(b.amount)}</div>${brcard(bscore(b))}
${[['Vendor',b.vendor],['Invoice no.',b.inv],['Date',fdate(b.date)],['Category',b.cat],['Ward',WARDS[b.ward].n]].map(x=>`<div class="ba-dr"><span class="ba-mu">${x[0]}</span><b>${esc(x[1])}</b></div>`).join('')}
<button class="ba-ah" onclick="B.aud=!B.aud;R()" aria-expanded="${B.aud}"><h2 class="ba-h2" style="margin:12px 0 4px">Audit history (${b.audit.length})</h2><span class="ba-mu">${B.aud?'▲':'▼'}</span></button>${audit}</div>
<div class="ba-acts"><button class="ba-chatb" onclick="B.ov='chat';B.focus=true;R()" aria-label="Open discussion">💬${b.comments.length?`<span>${b.comments.length}</span>`:''}</button>${acts}</div>${ov}</div></div>`}
const bopen=id=>{B.open=id;B.ov=null;B.aud=false;R()};
function bclose(){B.open=null;B.ov=null;R()}
const bcur=()=>S.bills.find(x=>x.id===B.open);
function bapprove(){const b=bcur();if(!b||S.role!=='admin')return;b.status='verified';b.audit.push({who:ADM,what:'Verified bill',at:stamp()});toast('Bill '+b.id+' verified.');bclose()}
function bflag(r){const b=bcur();if(!b||S.role!=='admin')return;b.status='flagged';
 b.audit.push({who:ADM,what:'Flagged – '+r,at:stamp()});b.comments.push({by:'Auditor',text:'Flagged for recheck: '+r+'.',at:stamp()});B.ov=null;toast('Bill flagged: '+r);R()}
function bresub(){const b=bcur();if(!b)return;b.status='pending';b.audit.push({who:sbn(b.ward),what:'Resubmitted after correction',at:stamp()});toast('Bill resubmitted for audit.');bclose()}
function bsend(){const b=bcur(),i=document.getElementById('bci');if(!b||!i||!i.value.trim())return;
 b.comments.push({by:S.role==='admin'?'Auditor':'Supervisor',text:i.value.trim(),at:stamp()});B.focus=true;R()}
function bTheme(){const r=document.documentElement,el=document.querySelector('.ba'),dark=getComputedStyle(el).getPropertyValue('--paper').trim().toUpperCase()==='#0E1424';r.dataset.theme=dark?'light':'dark'}
const _R=R;R=function(){_R();const m=document.getElementById('bmsgs');if(m)m.scrollTop=m.scrollHeight;if(B.focus){const i=document.getElementById('bci');if(i)i.focus();B.focus=false}};

R();
</script></body></html>
